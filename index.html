#xpwrap{position:absolute;left:2%;right:2%;top:7.4%;height:1.3%;background:#3a200c88;border-radius:9px;overflow:hidden;z-index:20;box-shadow:inset 0 1px 2px #0008,0 0 0 1.5px #fff8}
#xp{height:100%;width:0;background:linear-gradient(#fff3a0,#f2b21c 60%,#d88a00);border-radius:9px;transition:width .4s}
#xptxt{position:absolute;right:3%;top:8.9%;font-size:calc(var(--u)*2.6);color:#fff;font-weight:bold;text-shadow:0 1px 2px #000;z-index:20}
#bibles{position:absolute;top:14.5%;left:1%;right:1%;height:13%;display:flex;z-index:6}
.bible{flex:1;position:relative;cursor:pointer;transition:transform .25s}
.bible .bk{position:absolute;left:1%;right:1%;bottom:12%;aspect-ratio:300/233;background:center/contain no-repeat;filter:drop-shadow(0 4px 4px #0006)}
.bible.focus .bk{filter:drop-shadow(0 0 6px #fff6a8) drop-shadow(0 0 3px #ffd040) drop-shadow(0 4px 4px #0006)}
.bible.focus{transform:translateY(-4%) scale(1.07)}
.bible .pg{position:absolute;top:37%;height:30%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#5a3412;line-height:1.05}
.bible .pl{left:9%;width:40%}.bible .pr{left:51%;width:40%}
.bible .bn{position:absolute;left:4%;right:4%;bottom:5%;text-align:center;font-family:Georgia,serif;font-weight:bold;font-size:calc(var(--u)*2.9);color:#fff;background:linear-gradient(var(--c1),var(--c2));border:1.5px solid #ffe7a0;border-radius:6px;padding:2% 0;text-shadow:0 1px 1px #0008;box-shadow:0 2px 3px #0006;z-index:2}
.bible .ref{font-family:Georgia,serif;font-weight:bold;font-size:calc(var(--u)*3.4);color:#7a1d10}
.bible .cnt{font-family:Georgia,serif;font-weight:bold;font-size:calc(var(--u)*3);color:#6a4a20}
.bible .bar{position:absolute;left:12%;right:12%;bottom:-6%;height:9%;background:#0005;border-radius:9px;overflow:hidden;box-shadow:0 0 0 1.5px #fff9}
.bible .bar i{display:block;height:100%;width:0;background:linear-gradient(#bfffa0,#3cc23c);transition:width .35s}
.bible.done .bar i{background:linear-gradient(#fff6a0,#ffb800)}
.bible .glow{position:absolute;left:50%;top:40%;width:120%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(#fff6c0cc,#ffd76a55 40%,#fff0 70%);opacity:0;pointer-events:none;transition:opacity .4s}
.bible.done .glow{opacity:1;animation:breathe 1.2s infinite alternate}
@keyframes breathe{to{transform:translate(-50%,-50%) scale(1.15)}}
.read{position:absolute;left:4%;right:4%;top:-22%;display:none;background:linear-gradient(#fff9b0,#ffc21a 55%,#f09000);color:#6a3000;font-weight:900;font-size:calc(var(--u)*3.4);text-align:center;padding:5% 0;border-radius:99px;border:2px solid #fff;box-shadow:0 3px 0 #a85a00,0 0 14px #ffe060;z-index:9;animation:pulse .6s infinite alternate;letter-spacing:.5px;cursor:pointer}
.bible.done .read{display:block}
@keyframes pulse{to{transform:scale(1.1);box-shadow:0 3px 0 #a85a00,0 0 24px #fff3a0}}
.flip{position:absolute;left:50%;width:44%;top:6%;height:56%;transform-origin:0 50%;background:linear-gradient(90deg,#e8d8b0,#fff8e4 30%,#f6e7c4);border-radius:0 6px 6px 0;box-shadow:0 0 6px #0004;animation:flip .7s ease-in-out forwards;z-index:3;pointer-events:none}
@keyframes flip{0%{transform:perspective(300px) rotateY(0)}50%{filter:brightness(.8)}100%{transform:perspective(300px) rotateY(-180deg);filter:brightness(1.05)}}
#verse{position:absolute;top:30.5%;left:3%;right:3%;height:16%;z-index:5;background:linear-gradient(#fffaf0,#f6e6c4);border-radius:16px;border:3px solid #fff;box-shadow:0 0 0 3px #d9a440,0 6px 10px #0006,inset 0 -6px 12px #d9b98a66;padding:2% 3%;display:flex;flex-direction:column}
#verse::before,#verse::after{content:"";position:absolute;top:-9px;width:22px;height:22px;background:radial-gradient(circle at 40% 35%,#fff6c0,#f0b020 60%,#a86a00);border-radius:50%;box-shadow:0 1px 2px #0006}
#verse::before{left:-9px}#verse::after{right:-9px}
#vhead{display:flex;align-items:center;justify-content:space-between;font-family:Georgia,serif;font-weight:bold;color:#7a1d10;font-size:calc(var(--u)*3.5);border-bottom:1.5px solid #e0c48a;padding-bottom:1%;margin-bottom:1%}
#vhead small{color:#a07a40;font-size:70%;font-family:"Trebuchet MS";font-style:normal}
#slots{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:.5% 1.6%;font-family:Georgia,serif;font-size:calc(var(--u)*3.25);line-height:1.25;overflow:hidden}
.sl{position:relative;min-width:1em;color:#3a200c;white-space:nowrap}
.sl.e{color:transparent;border-bottom:2px solid #c8a46a;border-radius:1px}
.sl.e.nx{border-bottom-color:#f0a000;animation:blink .7s infinite alternate}
.sl.e.hint{color:#c8a46a77}
@keyframes blink{to{border-bottom-color:#ffe080;box-shadow:0 3px 6px -3px #ffb000}}
.sl.f{animation:ink .4s}
@keyframes ink{from{transform:scale(1.6);color:#f0a000;text-shadow:0 0 8px #ffe080}}
#board{position:absolute;top:49%;left:3%;right:3%;height:40%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:1.6%;padding:2%;border-radius:16px;background:linear-gradient(#6a3c1acc,#4a2810dd);box-shadow:inset 0 2px 10px #000a,0 0 0 3px #e2b660,0 0 0 5px #8a5520,0 6px 12px #0007;z-index:5}

.tile{padding:9% 10%;min-height:0;min-width:0;overflow:hidden}.tile span{letter-spacing:-.2px}.tile span{display:block;max-width:100%;max-height:100%;overflow:hidden}

.tile::after{content:"";position:absolute;left:12%;top:12%;width:76%;height:24%;border-radius:40%;background:linear-gradient(#ffffffa0,#fff0);pointer-events:none}
.tile:active{transform:scale(.92)}
.tile.empty{visibility:hidden}
.tile.pop{animation:pop .35s}
@keyframes pop{from{transform:scale(0)}70%{transform:scale(1.15)}}
.tile.shake{animation:shk .32s;filter:drop-shadow(0 0 4px #ff3020) drop-shadow(0 2px 1.5px #0007)}
@keyframes shk{20%{transform:translateX(-10%) rotate(-6deg)}50%{transform:translateX(9%) rotate(5deg)}80%{transform:translateX(-5%)}}
.tile.hl{animation:hl .6s infinite alternate}
@keyframes hl{to{transform:scale(1.08);filter:drop-shadow(0 0 7px #fff3a0) drop-shadow(0 0 4px #ffb000)}}
#bottom{position:absolute;bottom:1%;left:2%;right:2%;height:8.5%;display:flex;align-items:center;gap:2%;z-index:6}
.btn{width:16%;height:82%;border-radius:16px;border:2px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:calc(var(--u)*2.4);cursor:pointer;box-shadow:0 3px 0 #0005,0 4px 6px #0005;text-shadow:0 1px 1px #0008;position:relative}
.btn:active{transform:translateY(2px)}
.btn svg{width:55%;height:55%}
#hintb{background:linear-gradient(#8fd6ff,#2a7fd8)}#shufb{background:linear-gradient(#b8f080,#3aa02a)}

#card .vt span.on{opacity:1;transform:none}
#card .vr{font-family:Georgia,serif;font-weight:bold;color:#7a1d10;font-size:calc(var(--u)*3.8)}
#card .rw{display:flex;justify-content:center;gap:6%;margin-top:3%;font-weight:900;color:#6a3c18;font-size:calc(var(--u)*4)}
#card .rw img{height:1.3em;vertical-align:middle;margin-right:4px}
#amen{margin:4% auto 0;width:48%;background:linear-gradient(#b8f080,#3aa02a);color:#fff;font-weight:900;font-size:calc(var(--u)*4.4);border-radius:99px;border:3px solid #fff;padding:3% 0;box-shadow:0 4px 0 #1f6a14;text-shadow:0 2px 0 #1f6a14;cursor:pointer}

{id:'john',name:'John',v:[
['1:1',"In the beginning was the Word, and the Word was with God, and the Word was God."],
['8:32',"And ye shall know the truth, and the truth shall make you free."],
['10:11',"I am the good shepherd: the good shepherd giveth his life for the sheep."],
['14:1',"Let not your heart be troubled: ye believe in God, believe also in me."],
['15:12',"This is my commandment, That ye love one another, as I have loved you."],
['15:13',"Greater love hath no man than this, that a man lay down his life for his friends."],
['3:30',"He must increase, but I must decrease."],
['13:35',"By this shall all men know that ye are my disciples, if ye have love one to another."],
['14:6',"Jesus saith unto him, I am the way, the truth, and the life: no man cometh unto the Father, but by me."]]},
{id:'psalms',name:'Psalms',v:[
['23:1',"The LORD is my shepherd; I shall not want."],
['119:105',"Thy word is a lamp unto my feet, and a light unto my path."],
['118:24',"This is the day which the LORD hath made; we will rejoice and be glad in it."],
['56:3',"What time I am afraid, I will trust in thee."],
['37:4',"Delight thyself also in the LORD; and he shall give thee the desires of thine heart."],
['121:2',"My help cometh from the LORD, which made heaven and earth."],
['34:8',"O taste and see that the LORD is good: blessed is the man that trusteth in him."],
['150:6',"Let every thing that hath breath praise the LORD. Praise ye the LORD."],
['46:10',"Be still, and know that I am God: I will be exalted among the heathen, I will be exalted in the earth."]]},
{id:'proverbs',name:'Proverbs',v:[
['3:5',"Trust in the LORD with all thine heart; and lean not unto thine own understanding."],
['3:6',"In all thy ways acknowledge him, and he shall direct thy paths."],
['16:3',"Commit thy works unto the LORD, and thy thoughts shall be established."],
['15:1',"A soft answer turneth away wrath: but grievous words stir up anger."],
['17:22',"A merry heart doeth good like a medicine: but a broken spirit drieth the bones."],
['18:10',"The name of the LORD is a strong tower: the righteous runneth into it, and is safe."],
['16:18',"Pride goeth before destruction, and an haughty spirit before a fall."],
['1:7',"The fear of the LORD is the beginning of knowledge: but fools despise wisdom and instruction."],
['22:6',"Train up a child in the way he should go: and when he is old, he will not depart from it."]]},
{id:'romans',name:'Romans',v:[
['3:23',"For all have sinned, and come short of the glory of God;"],
['12:21',"Be not overcome of evil, but overcome evil with good."],
['6:23',"For the wages of sin is death; but the gift of God is eternal life through Jesus Christ our Lord."],
['12:12',"Rejoicing in hope; patient in tribulation; continuing instant in prayer;"],
['10:13',"For whosoever shall call upon the name of the Lord shall be saved."],
['8:31',"What shall we then say to these things? If God be for us, who can be against us?"],
['5:8',"But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us."],
['12:10',"Be kindly affectioned one to another with brotherly love; in honour preferring one another;"]]},
{id:'genesis',name:'Genesis',v:[
['1:1',"In the beginning God created the heaven and the earth."],
['1:3',"And God said, Let there be light: and there was light."],
['6:8',"But Noah found grace in the eyes of the LORD."],
['5:24',"And Enoch walked with God: and he was not; for God took him."],
['3:9',"And the LORD God called unto Adam, and said unto him, Where art thou?"],
['15:6',"And he believed in the LORD; and he counted it to him for righteousness."],
['1:4',"And God saw the light, that it was good: and God divided the light from the darkness."],
['1:27',"So God created man in his own image, in the image of God created he him; male and female created he them."]]}];
const DECOYS=['grace and','mercy endureth','the faith','his peace','great joy','in hope','the Spirit','holy hill','his glory','the kingdom','of heaven','living bread','still waters','the lamb','the river','his mountain','Blessed are','praise him','Amen.','of wisdom','my servant','the temple','an angel','the stars','good seed','the vine','my rock,','for ever.','with thee','the law','his mercy','my soul']
const PROPER=new Set(['god','lord','jesus','christ','noah','enoch','adam','father','word','i','that']);
const $=id=>document.getElementById(id);
const key=w=>w.replace(/[^A-Za-z']/g,'').toLowerCase();
function label(raw,first){const s=raw.replace(/[^A-Za-z']/g,'');if(!first)return s;const k=s.toLowerCase();return (k=='lord'&&s=='LORD')||['god','jesus','i','noah','enoch','adam'].includes(k)?s:k}
const st={lvl:1,xp:0,co:120,ge:15,vs:0};const need=()=>14+st.lvl*8;
// ---------- audio ----------
let AC;const ac=()=>AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
function tone(f,t=.15,type='sine',v=.18,d=0,slide){try{const c=ac(),o=c.createOscillator(),g=c.createGain(),n=c.currentTime+d;o.type=type;o.frequency.setValueAtTime(f,n);if(slide)o.frequency.exponentialRampToValueAtTime(slide,n+t);g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.012);g.gain.exponentialRampToValueAtTime(.001,n+t);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+t+.02)}catch(e){}}
const sfx={good:k=>{const f=520*Math.pow(1.06,Math.min(k||0,14));tone(f,.12,'triangle',.16);tone(f*1.5,.16,'sine',.08,.04)},
bad:()=>{tone(180,.18,'square',.07,0,110)},
coin:()=>{tone(988,.08,'square',.06);tone(1319,.25,'square',.06,.08)},
done:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.13,i*.09)),
choir:()=>{[392,494,587,784].forEach((f,i)=>{tone(f,1.6,'sine',.06,i*.05);tone(f*2,1.2,'sine',.02,.1+i*.05)});[1568,2093,2637].forEach((f,i)=>tone(f,.4,'sine',.05,.5+i*.12))},
flip:()=>{tone(900,.2,'sawtooth',.03,0,300);tone(600,.15,'triangle',.04,.15,250)},
lvl:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.35,'square',.07,i*.1))};
// ---------- state ----------
const bib=[];let focus=0,board=[],busy={},combo=0,idle=0,celebrating=false;const N=24;
function words(v){const a=v.split(/\s+/),c=[];for(let i=0;i<a.length;i+=2){const s=a.slice(i,i+2).join(' ');c.push({raw:s,k:s,lab:s})}return c}
function loadVerse(b){const B=BOOKS[b.book];const [ref,txt]=B.v[b.vi%B.v.length];b.ref=B.name+' '+ref;b.txt=txt;b.w=words(txt);b.got=0}
function nextKey(b){return b.got<b.w.length?b.w[b.got].k:null}
// ---------- render ----------
function renderBible(i){const b=bib[i],el=$('bibles').children[i],B=BOOKS[b.book];
 el.classList.toggle('done',b.got>=b.w.length);el.classList.toggle('focus',i==focus);
 el.querySelector('.bn').textContent=B.name;el.querySelector('.ref').textContent=b.ref.split(' ')[1];
 el.querySelector('.cnt').textContent=b.got+'/'+b.w.length;el.querySelector('.bar i').style.width=(100*b.got/b.w.length)+'%'}
function renderVerse(){const b=bib[focus];$('vref').textContent='📖 '+b.ref;$('vcount').textContent=b.got>=b.w.length?'Complete — tap READ!':b.got+' / '+b.w.length+' phrases';
 $('slots').innerHTML=b.w.map((w,j)=>`<span class="sl ${j<b.got?'f0':'e'}${j==b.got?' nx':''}">${j<b.got?w.raw:w.raw.replace(/./g,'\u2007')}</span>`).join('');fitSlots()}
function initBibles(){const order=[0,1,2,3,4];order.forEach((bk,i)=>{bib[i]={book:bk,vi:0};loadVerse(bib[i]);
 const el=document.createElement('div');el.className='bible';const CC={john:['#d8402c','#8a1a10'],psalms:['#3a7ae0','#173f8a'],proverbs:['#3aa84a','#16602a'],romans:['#9a4ad8','#55207a'],genesis:['#c8783a','#7a4214']}[BOOKS[bk].id];el.style.setProperty('--c1',CC[0]);el.style.setProperty('--c2',CC[1]);el.innerHTML=`<div class="glow"></div><div class="bk" style="background-image:url(${IMG['b_'+BOOKS[bk].id]})"></div><div class="pg pl"><div class="ref"></div></div><div class="pg pr"><div class="cnt"></div></div><div class="bn"></div><div class="bar"><i></i></div><div class="read">✨ READ</div>`;
 el.onpointerdown=e=>{e.preventDefault();setFocus(i)};el.querySelector('.read').onpointerdown=e=>{e.preventDefault();e.stopPropagation();readVerse(i)};
 $('bibles').appendChild(el);renderBible(i)})}
function setFocus(i){if(focus==i)return;focus=i;bib.forEach((_,j)=>renderBible(j));renderVerse();tone(660,.07,'sine',.08);const b=bib[i];$('info').textContent=b.got>=b.w.length?'Verse complete! Press READ above '+BOOKS[b.book].name+'.':'Building '+b.ref+' — find "'+b.w[b.got].lab+'"…'.replace(/find ".*"…/,'tap the next word!')}
// ---------- board ----------
function tileLabel(k){for(const b of bib)for(const w of b.w)if(w.k==k)return w.lab;return k}
function lab(k){return labels[k]||k}let labels={};
function setTile(i,k,anim){board[i]=k;if(k&&!labels[k])labels[k]=tileLabel(k);const c=$('board').children[i];c.className='tile'+(k?'':' empty')+(anim?' pop':'');const L=k?lab(k):'';c.innerHTML=k?`<span>${L}</span>`:'';fitTile(c)}
function fitTile(c){const s=c.firstChild;if(!s)return;s.style.fontSize='';s.style.maxHeight='none';let f=parseFloat(getComputedStyle(s).fontSize),n=0;const cs=getComputedStyle(c),H=c.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-2;while((s.scrollWidth>s.clientWidth||s.scrollHeight>H)&&n++<25){f*=.94;s.style.fontSize=f+'px'}s.style.maxHeight=''}
function fitSlots(){const e=$('slots');e.style.fontSize='';let f=parseFloat(getComputedStyle(e).fontSize),n=0;while(e.scrollHeight>e.clientHeight+1&&n++<20){f*=.93;e.style.fontSize=f+'px'}}
addEventListener('resize',()=>{[...$('board').children].forEach(fitTile);fitSlots()});
function wanted(){// for each unfinished bible: next 3 words must be present (counted)
 const w={};bib.forEach(b=>{const s=new Set();for(let j=b.got;j<Math.min(b.w.length,b.got+3);j++){const k=b.w[j].k;if(j==b.got||!s.has(k)){w[k]=Math.max(w[k]||0,1)}s.add(k)}});
 // words that are next for multiple bibles need one each
 const nx={};bib.forEach(b=>{const k=nextKey(b);if(k)nx[k]=(nx[k]||0)+1});for(const k in nx)w[k]=Math.max(w[k],nx[k]);return w}
function randWord(){if(Math.random()<.7){const b=bib[Math.random()*5|0];if(b.got<b.w.length){const j=b.got+Math.floor(Math.random()*Math.min(6,b.w.length-b.got));return b.w[j].k}}return DECOYS[Math.random()*DECOYS.length|0]}
function ensure(){const w=wanted(),on={};board.forEach(k=>k&&(on[k]=(on[k]||0)+1));
 const freeIdx=()=>{const c=[];board.forEach((k,i)=>{if(!busy[i]&&(!k||!w[k]||on[k]>w[k]))c.push(i)});return c[Math.random()*c.length|0]};
 for(const k in w){let g=0;while((on[k]||0)<w[k]&&g++<10){const i=freeIdx();if(i==null)break;const old=board[i];if(old)on[old]--;setTile(i,k,1);on[k]=(on[k]||0)+1}}}
function initBoard(){for(let i=0;i<N;i++){const c=document.createElement('div');c.className='tile';c.onpointerdown=e=>{e.preventDefault();tap(i)};$('board').appendChild(c);setTile(i,randWord())}ensure()}
// ---------- fx ----------
const G=()=>$('game').getBoundingClientRect();
function flyTo(fromEl,toEl,txt,cb,ms=460){const g=G(),a=fromEl.getBoundingClientRect(),b=toEl.getBoundingClientRect();const f=document.createElement('div');f.className='fly';f.style.transitionDuration=ms+'ms';f.textContent=txt;
 Object.assign(f.style,{left:a.left-g.left+'px',top:a.top-g.top+'px',width:a.width+'px',height:a.height+'px'});$('game').appendChild(f);
 requestAnimationFrame(()=>requestAnimationFrame(()=>Object.assign(f.style,{left:b.left-g.left-4+'px',top:b.top-g.top-2+'px',width:b.width+8+'px',height:b.height+4+'px',opacity:.85})));setTimeout(()=>{f.remove();cb&&cb()},ms)}
function floatTxt(el,txt,color){const g=G(),r=el.getBoundingClientRect();const f=document.createElement('div');f.className='float';f.textContent=txt;f.style.color=color||'#fff';f.style.left=r.left-g.left+r.width/2+'px';f.style.top=r.top-g.top+'px';$('game').appendChild(f);setTimeout(()=>f.remove(),1100)}
function sparks(x,y,n=10,dist=60){for(let k=0;k<n;k++){const s=document.createElement('img');s.src=IMG.spark;s.className='spark';const a=k/n*Math.PI*2+Math.random()*.4,d=dist*(.6+Math.random()*.7);s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');s.style.animationDelay=Math.random()*90+'ms';$('game').appendChild(s);setTimeout(()=>s.remove(),1000)}}
function coinsTo(fromEl,n){const g=G(),r=fromEl.getBoundingClientRect(),t=document.querySelectorAll('.pill')[0].getBoundingClientRect();
 for(let k=0;k<n;k++){const c=document.createElement('div');c.className='coinfx';c.style.left=r.left-g.left+r.width/2+(Math.random()-.5)*60+'px';c.style.top=r.top-g.top+r.height/2+(Math.random()-.5)*30+'px';$('game').appendChild(c);
  setTimeout(()=>{c.style.left=t.left-g.left+'px';c.style.top=t.top-g.top+'px';c.style.transform='scale(.6)'},60+k*70);setTimeout(()=>{c.remove();sfx.coin()},830+k*70)}}
function shake(c){sfx.bad();c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');combo=0}
function clearHL(){document.querySelectorAll('.tile.hl').forEach(t=>t.classList.remove('hl'));document.querySelectorAll('.sl.hint').forEach(s=>s.classList.remove('hint'))}
// ---------- core ----------
function tap(i){const k=board[i];if(!k||busy[i]||celebrating)return;idle=0;clearHL();const c=$('board').children[i];
 const cands=bib.map((b,j)=>j).filter(j=>nextKey(bib[j])==k);
 if(!cands.length){shake(c);$('info').textContent='"'+lab(k)+'" isn\u2019t the next phrase in any verse. Look at the glowing blank!';return}
 // prefer focused Bible, else the one with the most progress
 const s=cands.includes(focus)?focus:cands.sort((a,b)=>bib[b].got/bib[b].w.length-bib[a].got/bib[a].w.length)[0];
 if(s!=focus){focus=s;bib.forEach((_,j)=>renderBible(j));renderVerse()}
 const b=bib[s],idx=b.got;b.got++;combo++;sfx.good(combo);gainXP(1);st.co+=1;
 const slot=$('slots').children[idx];busy[i]=1;board[i]=null;const txt=c.textContent;c.className='tile empty';c.innerHTML='';
 flyTo(c,slot,txt,()=>{slot.className='sl f';slot.textContent=b.w[idx].raw;const nx=$('slots').children[idx+1];if(nx&&bib[focus]===b)nx.classList.add('nx');
   if(b.got>=b.w.length)complete(s)});
 const nx0=$('slots').children[idx];nx0.classList.remove('nx');
 renderBible(s);$('vcount').textContent=b.got>=b.w.length?'Complete — tap READ!':b.got+' / '+b.w.length+' phrases';
 $('info').textContent=combo>2?'🔥 '+combo+' in a row!':b.got>=b.w.length?'':'Next word for '+b.ref.split(' ')[0]+'…';
 setTimeout(()=>{delete busy[i];setTile(i,randWord(),1);ensure()},500);ensure();updHud()}
function complete(s){const b=bib[s],el=$('bibles').children[s];sfx.done();renderBible(s);if(s==focus)renderVerse();
 const g=G(),r=el.getBoundingClientRect();sparks(r.left-g.left+r.width/2,r.top-g.top+r.height/2,12,50);
 $('info').innerHTML='<span>✨ '+b.ref+' complete! Press <b>READ</b> to celebrate.</span>'}
function readVerse(s){const b=bib[s];if(b.got<b.w.length||celebrating)return;celebrating=true;sfx.choir();
 const reward=10+b.w.length*3+st.lvl*2,gems=b.w.length>=14?2:1;b.reward=reward;
 const C=$('cele'),card=$('card');card.querySelector('.vt').innerHTML=b.w.map(w=>`<span>${w.raw}</span>`).join(' ');card.querySelector('.vr').textContent='— '+b.ref+' (KJV)';
 card.querySelector('.rw').innerHTML=`<span><img src="${IMG.coin}">+${reward}</span><span><img src="${IMG.gem}">+${gems}</span>`;
 C.classList.add('on');card.style.animation='none';void card.offsetWidth;card.style.animation='';
 const sp=[...card.querySelectorAll('.vt span')];sp.forEach((x,j)=>setTimeout(()=>x.classList.add('on'),250+j*170));
 const g=G();let n=0;const iv=setInterval(()=>{sparks(g.width*(.15+Math.random()*.7),g.height*(.25+Math.random()*.4),6,50);if(++n>6)clearInterval(iv)},260);
 try{if(window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(b.txt+' '+b.ref.replace(':',', verse '));u.rate=.92;u.pitch=1;speechSynthesis.speak(u)}}catch(e){}
 st.ge+=gems;b.gems=gems;cele=s;clearTimeout(autoAmen);autoAmen=setTimeout(amen,9000)}
let cele=-1,autoAmen;
function amen(){if(cele<0)return;clearTimeout(autoAmen);const s=cele;cele=-1;const b=bib[s];try{speechSynthesis&&speechSynthesis.cancel()}catch(e){}
 $('cele').classList.remove('on');const el=$('bibles').children[s];coinsTo(el,7);floatTxt(el,'+'+b.reward,'#ffe040');st.co+=b.reward;st.vs++;gainXP(6);updHud();
 // page flip to next verse
 setTimeout(()=>{sfx.flip();const f=document.createElement('div');f.className='flip';el.appendChild(f);
  setTimeout(()=>{b.vi++;loadVerse(b);labels={};renderBible(s);focus=s;bib.forEach((_,j)=>renderBible(j));renderVerse();ensure();celebrating=false;$('info').textContent='New page: '+b.ref+'. Keep building!'},350);
  setTimeout(()=>f.remove(),720)},250)}
$('amen').onpointerdown=e=>{e.preventDefault();amen()};
function gainXP(n){st.xp+=n;while(st.xp>=need()){st.xp-=need();st.lvl++;st.ge+=5;sfx.lvl();const l=$('lvup');l.innerHTML='LEVEL '+st.lvl+'!<small>+5 gems</small>';l.style.display='flex';setTimeout(()=>l.style.display='none',1400)}updHud()}
$('lvup').onpointerdown=()=>$('lvup').style.display='none';
function updHud(){$('lvlt').textContent=st.lvl;$('co').textContent=st.co.toLocaleString();$('ge').textContent=st.ge;$('vs').textContent=st.vs;$('xp').style.width=(100*st.xp/need())+'%';$('xptxt').textContent=st.xp+' / '+need()+' XP'}
function hint(free){const b=bib[focus];if(b.got>=b.w.length)return false;const k=nextKey(b);const i=board.findIndex((x,j)=>x==k&&!busy[j]);if(i<0){ensure();return false}
 $('board').children[i].classList.add('hl');const sl=$('slots').children[b.got];if(sl&&!free){sl.classList.add('hint');sl.textContent=b.w[b.got].raw}return true}
$('hintb').onpointerdown=e=>{e.preventDefault();if(st.ge<5){$('info').textContent='Need 5 gems for a hint — finish verses to earn more!';sfx.bad();return}if(hint()){st.ge-=5;updHud();tone(880,.2,'sine',.1)}};
$('shufb').onpointerdown=e=>{e.preventDefault();if(celebrating)return;clearHL();const ks=board.slice();for(let i=ks.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[ks[i],ks[j]]=[ks[j],ks[i]]}ks.forEach((k,i)=>{if(!busy[i]&&k)setTile(i,k,1)});tone(500,.25,'triangle',.08,0,900)};
setInterval(()=>{if(celebrating)return;if(++idle==8)hint(true)},1000);
initBibles();initBoard();renderVerse();updHud();
</script></body></html>
